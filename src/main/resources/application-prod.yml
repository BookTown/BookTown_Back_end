#application-prod.yml
spring:
  config:
    activate:
      on-profile: prod

  application:
    name: booktown-prod

  datasource:
    url: ${MYSQL_URL}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}



google:
  credentials:
    location: file:/app/resources/key/stt.json